<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>GPX2Amap</title><style>body{font:14px system-ui,sans-serif;margin:16px;color:#1f2937;min-width:280px}h2{margin:0 0 12px}p{color:#64748b;line-height:1.5}.drop{border:1px dashed #94a3b8;border-radius:10px;padding:18px 10px;text-align:center;background:#f8fafc;cursor:pointer}.drop.drag{border-color:#1677ff;background:#eff6ff}.drop input{display:none}button{margin:8px 6px 0 0;padding:8px 11px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;cursor:pointer}button.primary{background:#1677ff;color:#fff;border-color:#1677ff}button:disabled{opacity:.5;cursor:default}label{display:block;margin:12px 0;color:#475569;font-size:13px}#status{padding:9px;background:#f1f5f9;border-radius:6px;margin:12px 0}.error{color:#b91c1c;background:#fef2f2!important}.result{margin-top:12px;padding:10px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:6px}.url{font-size:11px;word-break:break-all;color:#334155;max-height:96px;overflow:auto}.log{font-size:12px;border-bottom:1px solid #e5e7eb;padding:4px 0;color:#64748b}</style></head><body><h2>GPX2Amap</h2><p>上传 GPX，生成最多 16 个高德途经点。</p><div class="drop" id="drop">点击选择 GPX，或将文件拖到这里<input id="file" type="file" accept=".gpx,application/gpx+xml,application/xml,text/xml"></div><label><input id="gcj" type="checkbox"> GPX 已经是高德 GCJ-02 坐标（跳过转换）</label><div id="status">等待上传 GPX</div><div><button id="copy" disabled>复制链接</button><button id="open" class="primary" disabled>跳转高德</button></div><div id="result" class="result" hidden><div id="summary"></div><div class="url" id="url"></div></div><div id="logs"></div><script type="module" src="sidepanel.js"></script></body></html>
